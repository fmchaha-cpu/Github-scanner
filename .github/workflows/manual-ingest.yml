name: Ingest one listing URL

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Exact public listing URL'
        required: true
        type: string
      platform:
        description: 'Optional platform override (PlayerAuctions, ZeusX, EpicNPC...)'
        required: false
        type: string
      historical_status:
        description: 'Optional historical evidence label'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - SOLD_CONFIRMED
          - SOLD_CLAIMED
          - EXPIRED_REMOVED
          - OUTCOME_UNKNOWN
          - RISK_CONTAMINATED
      historical_confidence:
        description: '0..1 confidence for manual historical label'
        required: false
        default: '0.8'
        type: string
      historical_evidence:
        description: 'Short evidence note, e.g. exact sold page / archive screenshot'
        required: false
        default: 'manual_exact_url_review'
        type: string

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Ingest exact URL
        env:
          MARKET_API_URL: ${{ secrets.MARKET_API_URL }}
          MARKET_API_TOKEN: ${{ secrets.MARKET_API_TOKEN }}
          LISTING_URL: ${{ inputs.url }}
          PLATFORM: ${{ inputs.platform }}
          HIST_STATUS: ${{ inputs.historical_status }}
          HIST_CONF: ${{ inputs.historical_confidence }}
          HIST_EVIDENCE: ${{ inputs.historical_evidence }}
        shell: bash
        run: |
          args=("$LISTING_URL")
          if [ -n "$PLATFORM" ]; then args+=(--platform "$PLATFORM"); fi
          if [ -n "$HIST_STATUS" ]; then
            args+=(--historical-status "$HIST_STATUS" --historical-confidence "$HIST_CONF" --historical-evidence "$HIST_EVIDENCE")
          fi
          python -m genshin_collector.manual_ingest "${args[@]}"

name: Market collector health

on:
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Check API, deployment and last scan
        env:
          MARKET_API_URL: ${{ secrets.MARKET_API_URL }}
          MARKET_API_TOKEN: ${{ secrets.MARKET_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from datetime import datetime, timezone

          base = os.environ['MARKET_API_URL'].rstrip('/')
          token = os.environ.get('MARKET_API_TOKEN', '').strip()
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept': 'application/json',
          }
          if token:
              headers['Authorization'] = f'Bearer {token}'

          data = None
          last_error = None
          for attempt in range(1, 4):
              try:
                  req = urllib.request.Request(base + '/health', headers=headers)
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = json.load(r)
                  break
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')[:1000]
                  last_error = f'HTTP {exc.code}: {body}'
              except Exception as exc:
                  last_error = f'{type(exc).__name__}: {exc}'
              if attempt < 3:
                  time.sleep(attempt * 2)

          if data is None:
              raise SystemExit(f'Worker health check failed after 3 attempts: {last_error}')

          print(json.dumps(data, indent=2))
          version = str(data.get('version', 'unknown')).lstrip('v')
          if not version.startswith('1.0'):
              raise SystemExit(f'Worker deployment mismatch: expected v1.0, got {version}')
          last = data.get('last_scan')
          if not last or not last.get('started_at'):
              raise SystemExit('No completed scan has been recorded yet')
          ts = last['started_at'].replace('Z', '+00:00')
          age = (datetime.now(timezone.utc) - datetime.fromisoformat(ts)).total_seconds()/3600
          if age > 3:
              raise SystemExit(f'Collector stale: last scan {age:.1f} hours ago')
          if last.get('status') == 'failed':
              raise SystemExit('Last collector run failed')
          if int(data.get('historical_seed_records') or 0) < 10:
              raise SystemExit('Historical seed missing or incomplete; the next v1.0 scan will auto-repair it')
          PY

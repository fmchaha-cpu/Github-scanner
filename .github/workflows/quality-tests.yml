name: Quality checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'collector/**'
      - 'cloudflare/**'
      - '.github/workflows/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'cloudflare/**'
      - '.github/workflows/**'
      - 'scripts/**'

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: collector/requirements.txt
      - name: Install collector
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest tests -q
      - name: Run known-case recall benchmark
        run: python -m genshin_collector.benchmark --cases benchmarks/known_cases.json

  worker-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        run: npm install
      - name: Typecheck Worker
        run: npm run typecheck

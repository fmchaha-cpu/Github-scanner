name: Genshin market scan

on:
  workflow_dispatch:
  schedule:
    # Deliberately away from minute 0 because GitHub documents higher schedule load at the start of the hour.
    - cron: '17,47 * * * *'

concurrency:
  group: genshin-market-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: collector/requirements.txt
      - name: Install collector
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest tests -q
      - name: Scan public marketplace pages
        env:
          MARKET_API_URL: ${{ secrets.MARKET_API_URL }}
          MARKET_API_TOKEN: ${{ secrets.MARKET_API_TOKEN }}
        run: python -m genshin_collector.main --config sources.yaml

name: Genshin market scan

on:
  workflow_dispatch:

concurrency:
  group: genshin-market-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: collector/requirements.txt
      - name: Verify Worker compatibility
        env:
          MARKET_API_URL: ${{ secrets.MARKET_API_URL }}
          MARKET_API_TOKEN: ${{ secrets.MARKET_API_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request

          url = os.environ['MARKET_API_URL'].rstrip('/') + '/health'
          token = os.environ.get('MARKET_API_TOKEN', '').strip()
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153 Safari/537.36',
              'Accept': 'application/json',
          }
          if token:
              headers['Authorization'] = f'Bearer {token}'

          data = None
          last_error = None
          for attempt in range(1, 4):
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = json.load(r)
                  break
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode('utf-8', errors='replace')[:1000]
                  last_error = f'HTTP {exc.code}: {body}'
              except Exception as exc:
                  last_error = f'{type(exc).__name__}: {exc}'
              if attempt < 3:
                  time.sleep(attempt * 2)

          if data is None:
              raise SystemExit(f'Worker health check failed after 3 attempts: {last_error}')

          print(json.dumps(data, indent=2))
          version = str(data.get('version', 'unknown')).lstrip('v')
          if not version.startswith('1.0'):
              raise SystemExit(
                  f"Worker version {version!r} is not compatible with collector v1.0. "
                  "Deploy the v1.0 Worker and migration first."
              )
          required = {'source_health', 'field_provenance', 'historical_stats', 'comparables', 'multi_game', 'warframe_founder'}
          capabilities = set(data.get('capabilities') or [])
          missing = required - capabilities
          if missing:
              raise SystemExit(f"Worker missing required capabilities: {sorted(missing)}")
          PY
      - name: Install collector
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest tests -q
      - name: Fallback scan (Genshin and Warframe)
        env:
          MARKET_API_URL: ${{ secrets.MARKET_API_URL }}
          MARKET_API_TOKEN: ${{ secrets.MARKET_API_TOKEN }}
          DISCORD_WEBHOOK_GENSHIN: ${{ secrets.DISCORD_WEBHOOK_GENSHIN }}
          DISCORD_WEBHOOK_WARFRAME: ${{ secrets.DISCORD_WEBHOOK_WARFRAME }}
        run: python -m market_v1.run --games all

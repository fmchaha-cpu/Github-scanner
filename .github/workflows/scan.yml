name: Genshin market scan

on:
  workflow_dispatch:
  schedule:
    # Once per hour. We spend the saved budget on broader pagination and deeper verification.
    - cron: '17 * * * *'

concurrency:
  group: genshin-market-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: collector/requirements.txt
      - name: Verify Worker compatibility
        env:
          MARKET_API_URL: ${{ secrets.MARKET_API_URL }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = os.environ['MARKET_API_URL'].rstrip('/') + '/health'
          with urllib.request.urlopen(url, timeout=20) as r:
              data = json.load(r)
          print(json.dumps(data, indent=2))
          version = str(data.get('version', 'unknown')).lstrip('v')
          if not version.startswith('0.9'):
              raise SystemExit(
                  f"Worker version {version!r} is not compatible with collector v0.9. "
                  "Run scripts/deploy_v09.ps1 first."
              )
          required = {'source_health', 'field_provenance', 'historical_stats', 'comparables'}
          capabilities = set(data.get('capabilities') or [])
          missing = required - capabilities
          if missing:
              raise SystemExit(f"Worker missing required capabilities: {sorted(missing)}")
          PY
      - name: Install collector
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run tests
        run: python -m pytest tests -q
      - name: Scan public marketplace pages
        env:
          MARKET_API_URL: ${{ secrets.MARKET_API_URL }}
          MARKET_API_TOKEN: ${{ secrets.MARKET_API_TOKEN }}
        run: python -m genshin_collector.main --config sources.yaml

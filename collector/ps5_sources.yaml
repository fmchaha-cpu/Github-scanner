# Deutsche PS5-Angebote ohne Login-, CAPTCHA- oder Anti-Bot-Umgehung.
# Disc und Digital; nur neu oder offiziell/zertifiziert generalüberholt.
timeout_seconds: 30
minimum_alert_price_drop_eur: 10

# Referenz: offizielle deutsche PlayStation-Direct-Preise am 20.09.2026.
reference_prices:
  digital:
    new: 599.99
    certified_refurbished: 499.99
  disc:
    new: 649.99
    certified_refurbished: 549.99

# Gute Preise lösen einmalig einen Alert aus; ein neuer Alert folgt erst nach
# mindestens 10 EUR weiterem Preisfall oder beim Sprung von good zu excellent.
thresholds:
  digital:
    new:
      good: 519.99
      excellent: 469.99
    certified_refurbished:
      good: 499.99
      excellent: 449.99
  disc:
    new:
      good: 569.99
      excellent: 519.99
    certified_refurbished:
      good: 549.99
      excellent: 499.99


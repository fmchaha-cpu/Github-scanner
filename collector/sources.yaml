# Public, unauthenticated marketplace pages only. Do not bypass login, CAPTCHAs, rate limits, or anti-bot controls.
# Add/disable scan URLs as site structures evolve. Coverage rows make failures visible instead of silently pretending a source was scanned.

sources:
  - name: PlayerAuctions
    enabled: true
    use_browser_fallback: true
    detail_patterns:
      - '/genshin-impact-account/\\d+a'
    scans:
      - family: eu_all
        label: EU account index
        url: https://www.playerauctions.com/genshin-impact-account/eu/
      - family: c6_generic
        label: C6 category
        url: https://www.playerauctions.com/genshin-impact-account/c6/
      - family: favorite_or_relevant_character
        label: Furina category
        url: https://www.playerauctions.com/genshin-impact-account/furina/
      - family: favorite_or_relevant_character
        label: Venti category
        url: https://www.playerauctions.com/genshin-impact-account/venti/
      - family: favorite_or_relevant_character
        label: Columbina category
        url: https://www.playerauctions.com/genshin-impact-account/columbina/
      - family: favorite_or_relevant_character
        label: Arlecchino category
        url: https://www.playerauctions.com/genshin-impact-account/arlecchino/
      - family: favorite_or_relevant_character
        label: Mavuika category
        url: https://www.playerauctions.com/genshin-impact-account/mavuika/
      - family: resource_rich
        label: Reroll category
        url: https://www.playerauctions.com/genshin-impact-account/reroll/

  - name: ZeusX
    enabled: true
    use_browser_fallback: true
    # Keep deliberately broad; inspect first run's coverage and tighten after observing current ZeusX detail URLs.
    detail_patterns:
      - '/item/'
      - '/listing/'
      - '/genshin-impact/[^/]+/accounts/'
    scans:
      - family: all_accounts
        label: Genshin account marketplace
        url: https://zeusx.com/game/genshin-impact/13/accounts

  # Start disabled until you confirm the current public account index URL and terms/robots behavior.
  # The framework records disabled/unscanned sources separately in docs rather than pretending they are covered.
  - name: EpicNPC
    enabled: true
    use_browser_fallback: true
    detail_patterns:
      - '/threads/'
    scans:
      - family: eu_forum
        label: EU forum page 1
        page_label: page-1
        url: https://www.epicnpc.com/forums/genshin-impact-eu-accounts.2156/
      - family: eu_forum
        label: EU forum page 2
        page_label: page-2
        url: https://www.epicnpc.com/forums/genshin-impact-eu-accounts.2156/page-2
      - family: eu_forum
        label: EU forum page 3
        page_label: page-3
        url: https://www.epicnpc.com/forums/genshin-impact-eu-accounts.2156/page-3

  - name: Eldorado
    enabled: false
    use_browser_fallback: true
    detail_patterns:
      - '/[^/]+-account/'
    scans: []

  - name: G2G
    enabled: false
    use_browser_fallback: true
    detail_patterns:
      - '/offer/'
    scans: []

  - name: PlayerUp
    enabled: true
    use_browser_fallback: true
    detail_patterns:
      - '/threads/'
    scans:
      - family: all_accounts
        label: Genshin marketplace page 1
        page_label: page-1
        url: https://www.playerup.com/accounts/genshinimpactaccount/
      - family: price_low
        label: Genshin marketplace price ascending
        page_label: page-1-price-asc
        url: https://www.playerup.com/accounts/genshinimpactaccount/?direction=asc&order=price
